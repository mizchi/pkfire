name: conformance

on:
  push:
    branches: [main]
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install Pkl
        run: |
          curl -fsSL -o /tmp/pkl https://github.com/apple/pkl/releases/download/0.31.1/pkl-linux-amd64
          chmod +x /tmp/pkl && sudo mv /tmp/pkl /usr/local/bin/pkl
          pkl --version

      - name: Build pkf (release)
        run: |
          moon update
          moon build src/cmd/pkf --target native --release

      - name: Run MoonBit conformance runner (42/42 strict)
        working-directory: conformance
        env:
          PKF_MBT_BIN: ${{ github.workspace }}/_build/native/release/build/src/cmd/pkf/pkf.exe
        run: |
          moon update
          moon run --target native --release src
