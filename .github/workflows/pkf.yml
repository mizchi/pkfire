name: pkf

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "moon.mod"
      - "moon.work"
      - "examples/basic/**"
      - ".github/workflows/pkf.yml"
  pull_request:
    paths:
      - "src/**"
      - "moon.mod"
      - "moon.work"
      - "examples/basic/**"
      - ".github/workflows/pkf.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Build + smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Moon version
        run: moon version --all

      - name: Moon update
        run: moon update

      - name: Moon check
        run: moon check src/cmd/pkf src/loader --target native --deny-warn

      - name: Build pkf (release)
        run: moon build src/cmd/pkf --target native --release

      - name: Smoke - pkf list (examples/basic)
        working-directory: examples/basic
        run: ../../_build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe list

      - name: Smoke - pkf graph (examples/basic)
        working-directory: examples/basic
        run: ../../_build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe graph

      - name: Smoke - pkf run hello
        working-directory: examples/basic
        env:
          PKFIRE_MBT_CACHE_DIR: ${{ runner.temp }}/pkfire-mbt-cache
        run: |
          rm -rf "$PKFIRE_MBT_CACHE_DIR"
          ../../_build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe run hello

      # This step used to run `hello` twice and call it "cache miss +
      # cache hit". `hello` declares no `inputs`, so it is never cached
      # and the second run was another miss; nothing was asserted
      # either way. `count` appends to a file it does not declare as an
      # output, so the byte count is the evidence: one after a hit, two
      # after a re-run.
      - name: Smoke - a cache hit skips the command
        working-directory: examples/cache-hit
        env:
          PKFIRE_MBT_CACHE_DIR: ${{ runner.temp }}/pkfire-hit-cache
        run: |
          set -eu
          BIN=../../_build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe
          rm -rf "$PKFIRE_MBT_CACHE_DIR" runs.log out.log
          "$BIN" run count
          "$BIN" run count | tee second.log
          grep -q 'cache hit' second.log || { echo "second run did not hit"; exit 1; }
          actual=$(wc -c < runs.log | tr -d ' ')
          [ "$actual" = "1" ] || { echo "command re-ran: runs.log is $actual bytes"; exit 1; }

      # Both halves of a timeout: the run ends at the deadline, and
      # nothing after the hung command runs. A teardown that signals the
      # child first would let the shell notice, carry on, and print
      # "after the sleep" — so its absence is the real assertion.
      - name: Smoke - a timeout kills the tree and stops the script
        working-directory: examples/timeout
        env:
          PKFIRE_MBT_CACHE_DIR: ${{ runner.temp }}/pkfire-timeout-cache
        run: |
          set -eu
          BIN=../../_build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe
          rm -rf "$PKFIRE_MBT_CACHE_DIR" done.txt
          start=$(date +%s)
          set +e
          "$BIN" run hang > hang.out 2> hang.err
          code=$?
          set -e
          elapsed=$(( $(date +%s) - start ))
          [ "$code" = "143" ] || { echo "expected 143, got $code"; cat hang.err; exit 1; }
          [ "$elapsed" -lt 30 ] || { echo "waited ${elapsed}s for a 2s deadline"; exit 1; }
          grep -q 'before the sleep' hang.out || { echo "the command did not start"; exit 1; }
          grep -q 'after the sleep' hang.out && { echo "the script kept running past its deadline"; exit 1; }
          grep -q 'exceeded its 2s timeout' hang.err || { echo "no timeout diagnostic"; exit 1; }
          # The command writes `survived.txt` after its 6s sleep. Waiting
          # past that and finding no marker is a direct check that the
          # tree really died — where grepping the process table for a
          # surviving `sleep` would match unrelated processes on a shared
          # runner, including the shell running the check.
          sleep 7
          [ ! -f survived.txt ] || { echo "the killed command kept running"; exit 1; }
          # A task inside its deadline is untouched.
          "$BIN" run quick | grep -q 'finished well inside the deadline'
          # And a task this machine cannot run says so by name.
          set +e
          "$BIN" run elsewhere 2> elsewhere.err
          set -e
          grep -q 'requires execution platform plan9/vax' elsewhere.err \
            || { echo "no platform diagnostic"; cat elsewhere.err; exit 1; }
          rm -f hang.out hang.err elsewhere.err

      # The split store, end to end: sharing across two keys, a
      # pre-split entry still hitting after an upgrade, and a prune that
      # keeps a blob another entry still names.
      - name: Smoke - the cache shares blobs and still reads pre-split entries
        working-directory: examples/cas-share
        env:
          PKFIRE_MBT_CACHE_DIR: ${{ runner.temp }}/pkfire-cas-cache
        run: |
          set -eu
          BIN=../../_build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe
          rm -rf "$PKFIRE_MBT_CACHE_DIR" dist
          "$BIN" run build > /dev/null
          printf 'two\n' > src/changing.txt
          "$BIN" run build > /dev/null
          # Two keys, four declared outputs, three distinct contents.
          entries=$(find "$PKFIRE_MBT_CACHE_DIR/ac" -name result.json | wc -l | tr -d ' ')
          blobs=$(find "$PKFIRE_MBT_CACHE_DIR/blobs" -type f | wc -l | tr -d ' ')
          [ "$entries" = "2" ] || { echo "expected 2 entries, got $entries"; exit 1; }
          [ "$blobs" = "3" ] || { echo "expected 3 blobs, got $blobs"; exit 1; }
          "$BIN" cache stats | grep -q '^shared:' \
            || { echo "stats did not report sharing"; "$BIN" cache stats; exit 1; }

          # Dropping one of the two entries frees only what it alone
          # named; the blob the other still names has to survive.
          key=$(find "$PKFIRE_MBT_CACHE_DIR/ac" -name result.json | head -1 \
            | sed "s|$PKFIRE_MBT_CACHE_DIR/ac/||; s|/result.json||; s|/||")
          "$BIN" cache rm "$key" | grep -q 'blob' \
            || { echo "rm did not report a sweep"; exit 1; }
          left=$(find "$PKFIRE_MBT_CACHE_DIR/blobs" -type f | wc -l | tr -d ' ')
          [ "$left" = "2" ] || { echo "expected 2 blobs after rm, got $left"; exit 1; }
          # The surviving entry must still restore.
          rm -rf dist
          "$BIN" run build | grep -q 'cache hit' \
            || { echo "the surviving entry stopped hitting after the sweep"; exit 1; }
          cmp -s dist/changing.txt src/changing.txt \
            || { echo "the restored output is wrong"; exit 1; }

          # A pre-split entry, planted by hand under the key the runner
          # asks for, with contents no run could produce.
          rm -rf "$PKFIRE_MBT_CACHE_DIR" dist stage
          key=$("$BIN" run build --print-hash | awk '$2 == "build" { print $1 }')
          mkdir -p stage/dist
          echo FROM-A-PRE-SPLIT-ENTRY > stage/dist/changing.txt
          echo FROM-A-PRE-SPLIT-ENTRY > stage/dist/stable.txt
          mkdir -p "$PKFIRE_MBT_CACHE_DIR/cas/${key:0:2}/${key:2}"
          tar czf "$PKFIRE_MBT_CACHE_DIR/cas/${key:0:2}/${key:2}/entry.tar.gz" -C stage dist
          rm -rf stage
          "$BIN" run build | grep -q 'cache hit' \
            || { echo "a pre-split entry stopped hitting"; exit 1; }
          grep -q FROM-A-PRE-SPLIT-ENTRY dist/changing.txt \
            || { echo "the pre-split entry did not restore its contents"; exit 1; }
          printf 'one\n' > src/changing.txt
          rm -rf dist

      # The cache grows without bound unless something sweeps it, and
      # the sweep has to keep what is still in use: ordering by write
      # time evicts exactly the entries a daily build depends on.
      - name: Smoke - the vacuum evicts by last use and runs on its own
        working-directory: examples/cas-share
        env:
          PKFIRE_MBT_CACHE_DIR: ${{ runner.temp }}/pkfire-vacuum-cache
        run: |
          set -eu
          BIN=../../_build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe
          rm -rf "$PKFIRE_MBT_CACHE_DIR" dist
          for v in one two three; do
            printf '%s\n' "$v" > src/changing.txt
            "$BIN" run build > /dev/null
          done
          entries=$(find "$PKFIRE_MBT_CACHE_DIR/ac" -name result.json | wc -l | tr -d ' ')
          [ "$entries" = "3" ] || { echo "expected 3 entries, got $entries"; exit 1; }

          # `touch -d` takes a relative time on GNU and an ISO stamp on
          # BSD, so compute the timestamps and use the portable `-t`.
          old_stamp=$(date -d '40 days ago' +%Y%m%d%H%M 2>/dev/null \
            || date -v-40d +%Y%m%d%H%M)
          stale_stamp=$(date -d '2 days ago' +%Y%m%d%H%M 2>/dev/null \
            || date -v-2d +%Y%m%d%H%M)

          # Age every entry past the limit, then hit the first one again.
          # Only that entry should survive an age sweep.
          find "$PKFIRE_MBT_CACHE_DIR/ac" -name result.json \
            -exec touch -t "$old_stamp" {} +
          printf 'one\n' > src/changing.txt
          rm -rf dist
          "$BIN" run build | grep -q 'cache hit' \
            || { echo "the aged entry stopped hitting"; exit 1; }
          "$BIN" cache vacuum --max-age 30d --max-bytes 0 > vacuum.out
          cat vacuum.out
          left=$(find "$PKFIRE_MBT_CACHE_DIR/ac" -name result.json | wc -l | tr -d ' ')
          [ "$left" = "1" ] || { echo "expected 1 entry after the sweep, got $left"; exit 1; }
          # And it is the one that was used, not the one written last.
          rm -rf dist
          "$BIN" run build | grep -q 'cache hit' \
            || { echo "the vacuum evicted the entry that was still in use"; exit 1; }

          # The automatic sweep: due once the stamp is stale, and not
          # again on the build after it.
          touch -t "$stale_stamp" "$PKFIRE_MBT_CACHE_DIR/gc-stamp"
          printf 'four\n' > src/changing.txt
          PKFIRE_MBT_CACHE_MAX_BYTES=1 "$BIN" run build 2>&1 \
            | grep -q 'cache vacuum removed' \
            || { echo "the automatic vacuum did not run when it was due"; exit 1; }
          printf 'five\n' > src/changing.txt
          if PKFIRE_MBT_CACHE_MAX_BYTES=1 "$BIN" run build 2>&1 \
            | grep -q 'cache vacuum removed'; then
            echo "the automatic vacuum ran twice inside its interval"; exit 1
          fi
          # Turning it off keeps it off even with the stamp stale.
          touch -t "$stale_stamp" "$PKFIRE_MBT_CACHE_DIR/gc-stamp"
          printf 'six\n' > src/changing.txt
          if PKFIRE_MBT_CACHE_GC_INTERVAL=0 PKFIRE_MBT_CACHE_MAX_BYTES=1 \
            "$BIN" run build 2>&1 | grep -q 'cache vacuum removed'; then
            echo "PKFIRE_MBT_CACHE_GC_INTERVAL=0 did not disable the sweep"; exit 1
          fi
          printf 'one\n' > src/changing.txt
          rm -rf dist vacuum.out

      # Three things at once: a flaky task recovers, a broken one still
      # fails with its own exit code, and a task that did not ask for a
      # retry gets exactly one attempt. The last is the guard against a
      # loop that retries everything.
      - name: Smoke - retries recover a flaky task without hiding a broken one
        working-directory: examples/retries
        env:
          PKFIRE_MBT_CACHE_DIR: ${{ runner.temp }}/pkfire-retries-cache
        run: |
          set -eu
          BIN=../../_build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe
          rm -rf "$PKFIRE_MBT_CACHE_DIR" attempts.log ok.txt once.log run.jsonl
          "$BIN" run flaky --execution-log=run.jsonl > flaky.out 2> flaky.err
          [ -f ok.txt ] || { echo "the retry did not produce the output"; exit 1; }
          grep -q 'retrying (attempt 2 of 3)' flaky.err \
            || { echo "the retry was not reported"; cat flaky.err; exit 1; }
          # Two spawns, not one: the counter the command appends to is
          # undeclared, so the cache neither stores nor restores it and
          # its size is a direct count of attempts.
          n=$(wc -c < attempts.log | tr -d ' ')
          [ "$n" = "2" ] || { echo "expected 2 attempts, counter says $n"; exit 1; }
          grep -q '"attempts":2' run.jsonl || { echo "no attempt count in the log"; exit 1; }
          grep -q '"retried":1' run.jsonl || { echo "summary did not count the retry"; exit 1; }

          # A task that fails every time still fails, with the command's
          # own exit code rather than something the retry invented.
          set +e
          "$BIN" run doomed 2> doomed.err
          code=$?
          set -e
          [ "$code" = "9" ] || { echo "expected 9, got $code"; cat doomed.err; exit 1; }
          [ "$(grep -c 'retrying' doomed.err)" = "1" ] \
            || { echo "wrong number of retries"; cat doomed.err; exit 1; }

          # No `retries`, so exactly one attempt.
          set +e
          "$BIN" run once 2> once.err
          set -e
          o=$(wc -c < once.log | tr -d ' ')
          [ "$o" = "1" ] || { echo "a task without retries was retried $o times"; exit 1; }
          grep -q 'retrying' once.err && { echo "a task without retries reported one"; exit 1; }

          # Under --sandbox every attempt gets a fresh tree, so the
          # counter never survives and nothing leaks into the workspace.
          rm -rf "$PKFIRE_MBT_CACHE_DIR" attempts.log ok.txt
          set +e
          "$BIN" run flaky --sandbox 2> box.err
          code=$?
          set -e
          [ "$code" = "7" ] || { echo "expected 7 from a sandboxed flaky task, got $code"; exit 1; }
          [ "$(grep -c 'retrying' box.err)" = "2" ] \
            || { echo "expected 2 retries under sandbox"; cat box.err; exit 1; }
          [ ! -f attempts.log ] || { echo "a failed attempt leaked into the workspace"; exit 1; }
          rm -f flaky.out flaky.err doomed.err once.err box.err once.log run.jsonl ok.txt

      # The Pkl evaluation cache has to survive a build. It records a
      # digest of each module directory so a new module matching a glob
      # import invalidates it — but the entry point's directory is the
      # project root, and with the documented
      # `PKFIRE_MBT_CACHE_DIR=.pkf-cache` layout a build writes into it.
      # Hashing the whole listing meant every build invalidated the plan
      # it had just cached. Asserted on the entry's bytes rather than on
      # a stopwatch, so the check does not depend on machine speed.
      - name: Smoke - a build does not invalidate the evaluation cache
        working-directory: examples/cache-hit
        env:
          PKFIRE_MBT_CACHE_DIR: .pkf-cache
        run: |
          set -eu
          BIN=../../_build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe
          rm -rf .pkf-cache runs.log out.log said.txt
          # Warm the evaluation cache.
          "$BIN" list > /dev/null
          "$BIN" list > /dev/null
          entry=$(find .pkf-cache/eval -type f | head -1)
          [ -n "$entry" ] || { echo "the evaluation cache stored nothing"; exit 1; }
          before=$(sha256sum "$entry" | awk '{print $1}')

          # A build writes action-cache entries and blobs into the same
          # directory tree the Taskfile lives in.
          "$BIN" run count > /dev/null
          "$BIN" list > /dev/null
          after=$(sha256sum "$entry" | awk '{print $1}')
          [ "$before" = "$after" ] \
            || { echo "a build invalidated the evaluation cache"; exit 1; }

          # And the digest still does its job: a new module invalidates.
          echo 'x = 1' > extra.pkl
          "$BIN" list > /dev/null
          rewritten=$(sha256sum "$entry" | awk '{print $1}')
          [ "$before" != "$rewritten" ] \
            || { echo "a new module did not invalidate the evaluation cache"; exit 1; }
          rm -f extra.pkl runs.log out.log said.txt
          rm -rf .pkf-cache

      # The remote cache against a backend that reads bodies by
      # `Content-Length` only, the way an object store does. Uploads
      # used to go out chunked with no length, so such a backend stored
      # a zero-byte object, returned 200, and every later fetch got a
      # well-formed empty archive — a remote cache that was silently
      # doing nothing.
      - name: Smoke - the remote cache uploads a body a strict backend can read
        working-directory: examples/cache-hit
        env:
          PKFIRE_MBT_CACHE_DIR: ${{ runner.temp }}/pkfire-remote-cache
          PKFIRE_MBT_REMOTE_CACHE: http://127.0.0.1:8760
        run: |
          set -eu
          BIN=../../_build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe
          STORE="${{ runner.temp }}/pkfire-remote-store"
          rm -rf "$PKFIRE_MBT_CACHE_DIR" "$STORE" runs.log out.log said.txt
          python3 ../remote-cache-worker/testing/strict_cache_server.py "$STORE" 8760 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -s -o /dev/null --noproxy '*' http://127.0.0.1:8760/probe && break
            sleep 1
          done

          # Run once: stores locally, then uploads. The server rejects a
          # chunked body with 411, so a regression shows up as an empty
          # store rather than as a passing test.
          "$BIN" run say > /dev/null
          sleep 1
          uploaded=$(find "$STORE" -name entry.tar.gz | head -1)
          [ -n "$uploaded" ] || { echo "nothing reached the remote"; exit 1; }
          size=$(wc -c < "$uploaded" | tr -d ' ')
          [ "$size" -gt 0 ] || { echo "the remote stored a zero-byte entry"; exit 1; }
          tar tzf "$uploaded" > /dev/null || { echo "the uploaded archive is not readable"; exit 1; }

          # And it comes back: a cold local cache must be a remote hit
          # that replays the transcript, not a re-run.
          rm -rf "$PKFIRE_MBT_CACHE_DIR" said.txt
          "$BIN" run say > fetched.out
          grep -q 'remote cache hit' fetched.out \
            || { echo "the entry did not come back from the remote"; cat fetched.out; exit 1; }
          grep -q 'built the thing' fetched.out \
            || { echo "the replayed transcript is missing"; cat fetched.out; exit 1; }
          rm -f fetched.out runs.log out.log said.txt

      # Build settings that transition. `config` is unreleased, so the
      # fixture amends the schema by relative path and the conformance
      # harness — which copies fixtures to a temp tree — cannot reach
      # it; this covers it until the schema ships.
      - name: Smoke - build settings reach dependencies and pinning holds
        working-directory: examples/config-flags
        env:
          PKFIRE_MBT_CACHE_DIR: ${{ runner.temp }}/pkfire-config-cache
        run: |
          set -eu
          BIN=../../_build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe
          rm -rf "$PKFIRE_MBT_CACHE_DIR" dist
          "$BIN" run app > /dev/null
          # `lib` declares nothing and is built in `app`'s configuration;
          # `codegen` pins `mode` and still inherits `lto`.
          grep -q 'lib mode=release lto=on' dist/lib.txt \
            || { echo "lib did not inherit the settings"; cat dist/lib.txt; exit 1; }
          grep -q 'gen mode=debug lto=on' dist/gen.txt \
            || { echo "codegen did not pin mode while inheriting lto"; cat dist/gen.txt; exit 1; }

          # The setting is in the key, so the same task in two
          # configurations is two entries.
          plain=$("$BIN" run lib --print-hash | awk '$2 == "lib" { print $1 }')
          via=$("$BIN" run app --print-hash | awk '$2 == "lib" { print $1 }')
          [ "$plain" != "$via" ] \
            || { echo "lib keyed the same with and without the settings"; exit 1; }

          # `--config` seeds the run; a task that pinned the setting
          # still wins, or pinning would mean nothing from the outside.
          rm -rf dist
          "$BIN" run lib codegen --config mode=release > /dev/null
          grep -q 'lib mode=release' dist/lib.txt \
            || { echo "--config did not reach lib"; cat dist/lib.txt; exit 1; }
          grep -q 'gen mode=debug' dist/gen.txt \
            || { echo "--config overrode a pinned task"; cat dist/gen.txt; exit 1; }

          # A bare key is refused rather than read as an empty value.
          set +e
          "$BIN" run lib --config release 2> bad.err
          code=$?
          set -e
          [ "$code" != "0" ] || { echo "a bare --config was accepted"; exit 1; }
          grep -q 'KEY=VALUE' bad.err \
            || { echo "no diagnostic for a bare --config"; cat bad.err; exit 1; }

          # Two configurations of one task in one run: refused, named for
          # what actually differs.
          set +e
          "$BIN" run app debug-app 2> conflict.err
          code=$?
          set -e
          [ "$code" != "0" ] || { echo "two configurations were not refused"; exit 1; }
          grep -q 'two build configurations' conflict.err \
            || { echo "wrong diagnostic"; cat conflict.err; exit 1; }
          grep -q 'Differs on: mode: debug vs release' conflict.err \
            || { echo "the differing setting was not named"; cat conflict.err; exit 1; }
          rm -f bad.err conflict.err
          rm -rf dist

      # A transition is only worth anything if it reaches toolchain
      # *resolution*. `lib` declares no platform, so before this it
      # resolved `cc` to the host compiler even inside an arm64 build —
      # and two different cross builds shared that one entry.
      - name: Smoke - a transition reaches the dependency's toolchain
        working-directory: examples/transitions
        env:
          PKFIRE_MBT_CACHE_DIR: ${{ runner.temp }}/pkfire-transitions-cache
        run: |
          set -eu
          BIN=../../_build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe
          export PATH="$PWD/bin:$PATH"
          rm -rf "$PKFIRE_MBT_CACHE_DIR" dist
          # On its own, `lib` is a host build.
          "$BIN" explain -f with-toolchains.pkl lib | grep -q 'cc  cc (host)' \
            || { echo "lib did not resolve the host compiler on its own"; exit 1; }
          # Reached through the arm64 app, it selects the cross compiler
          # and records the target it was built for.
          "$BIN" run -f with-toolchains.pkl app --dry-run --explain-cache > box.txt
          grep -q 'toolchain.cc.selected=aarch64-linux-gnu-gcc' box.txt \
            || { echo "the transition did not reach toolchain resolution"; cat box.txt; exit 1; }
          [ "$(grep -c 'target:     linux/arm64' box.txt)" = "2" ] \
            || { echo "the target platform did not reach both actions"; cat box.txt; exit 1; }
          # And the key moves with it, which is the whole point: a host
          # build of `lib` and an arm64 build of `lib` are not the same
          # entry.
          alone=$("$BIN" run -f with-toolchains.pkl lib --print-hash | awk '$2 == "lib" { print $1 }')
          via=$("$BIN" run -f with-toolchains.pkl app --print-hash | awk '$2 == "lib" { print $1 }')
          [ "$alone" != "$via" ] \
            || { echo "lib keyed the same for a host build and an arm64 build"; exit 1; }
          rm -f box.txt
          rm -rf dist

      # One `cc` declaration, two targets, two compilers, two keys.
      # This is what makes a toolchain a resolver rather than a lookup.
      - name: Smoke - the target platform selects the toolchain
        working-directory: examples/cross
        env:
          PKFIRE_MBT_CACHE_DIR: ${{ runner.temp }}/pkfire-cross-cache
        run: |
          set -eu
          BIN=../../_build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe
          export PATH="$PWD/bin:$PATH"
          rm -rf "$PKFIRE_MBT_CACHE_DIR" dist
          "$BIN" explain native | grep -q 'cc  cc (host)' \
            || { echo "the native build did not resolve to the host compiler"; exit 1; }
          "$BIN" explain cross | grep -q 'cc -> aarch64-linux-gnu-gcc' \
            || { echo "the target platform did not select the cross compiler"; exit 1; }
          n=$("$BIN" run native --print-hash | awk '{print $1}')
          c=$("$BIN" run cross --print-hash | awk '{print $1}')
          [ "$n" != "$c" ] \
            || { echo "two targets shared one action key"; exit 1; }

      # `tools` is a string the author must remember to bump; a
      # `Toolchain` is resolved. The assertion is that upgrading the
      # tool moves the key with nothing edited in the Taskfile.
      - name: Smoke - a toolchain upgrade invalidates the cache by itself
        working-directory: examples/toolchains
        env:
          PKFIRE_MBT_CACHE_DIR: ${{ runner.temp }}/pkfire-toolchain-cache
        run: |
          set -eu
          BIN=../../_build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe
          export PATH="$PWD/bin:$PATH"
          rm -rf "$PKFIRE_MBT_CACHE_DIR" dist
          before=$("$BIN" run build --print-hash | awk '{print $1}')
          "$BIN" explain build | grep -q 'faketool version 1.0.0' \
            || { echo "the toolchain was not resolved"; exit 1; }
          printf '#!/bin/sh\necho "faketool version 2.0.0"\n' > bin/faketool
          chmod +x bin/faketool
          after=$("$BIN" run build --print-hash | awk '{print $1}')
          [ "$before" != "$after" ] \
            || { echo "the key did not move when the toolchain did"; exit 1; }
          # The resolved *path* must stay out of the key, or two
          # machines with the same compiler at different prefixes stop
          # sharing remote cache entries.
          mkdir -p ../../.tc-alt && cp bin/faketool ../../.tc-alt/faketool
          moved=$(PATH="$PWD/../../.tc-alt:$PATH" "$BIN" run build --print-hash | awk '{print $1}')
          [ "$moved" = "$after" ] \
            || { echo "the resolved path leaked into the action key"; exit 1; }
          rm -rf ../../.tc-alt
          git checkout -- bin/faketool

      # The property that makes steps worth having: an edit that only
      # reaches the later steps reuses the earlier ones. Asserted by
      # what is *not* re-run, since a pipeline written as one `&&`
      # chain would re-run all of it and still look fine.
      - name: Smoke - a multi-step task rebuilds only the steps that changed
        working-directory: examples/steps
        env:
          PKFIRE_MBT_CACHE_DIR: ${{ runner.temp }}/pkfire-steps-cache
        run: |
          set -eu
          BIN=../../_build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe
          rm -rf "$PKFIRE_MBT_CACHE_DIR" gen lib dist
          "$BIN" run bundle
          # Touch only what the *last two* steps read.
          printf 'src-v2\n' > src/main.txt
          "$BIN" run bundle > second.log
          grep -q '# bundle/codegen (cache hit' second.log \
            || { echo "codegen re-ran even though its inputs did not change"; exit 1; }
          grep -q '\$ bundle/compile' second.log \
            || { echo "compile did not re-run"; exit 1; }
          grep -q '\$ bundle/link' second.log \
            || { echo "link did not re-run"; exit 1; }
          grep -q 'src-v2' dist/app.txt \
            || { echo "the pipeline did not carry the change through"; exit 1; }
          git checkout -- src/main.txt

      # `provides` is unreleased, so no URI-pinned example can exercise
      # it yet — this fixture amends the in-tree schema instead, which
      # makes this step the end-to-end check until the release moves
      # the examples onto the published package.
      - name: Smoke - a provider reaches the task that depends on it
        working-directory: examples/providers
        env:
          PKFIRE_MBT_CACHE_DIR: ${{ runner.temp }}/pkfire-provider-cache
        run: |
          set -eu
          BIN=../../_build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe
          rm -rf "$PKFIRE_MBT_CACHE_DIR" apps/web/smoked.txt crates/cli/target
          "$BIN" run smoke
          # `cli` writes its binary under `crates/cli`; `smoke` runs from
          # `apps/web`. The path that works from there is the walk
          # between the two, which is what the provider computed.
          grep -q '^source$' apps/web/smoked.txt || { echo "executable provider did not resolve"; exit 1; }
          grep -q '^channel=stable$' apps/web/smoked.txt || { echo "env provider did not resolve"; exit 1; }
          "$BIN" explain smoke | grep -q 'PKF_CLI_EXECUTABLE=../../crates/cli/target/cli' \
            || { echo "explain did not report the provider"; exit 1; }

      # A hit that skips the command must still show what the command
      # said, or a build's transcript depends on whether the cache
      # happened to be warm. `say` is not re-executed here, so every
      # line below came out of the cache entry.
      - name: Smoke - a cache hit replays the stored logs
        working-directory: examples/cache-hit
        env:
          PKFIRE_MBT_CACHE_DIR: ${{ runner.temp }}/pkfire-replay-cache
        run: |
          set -eu
          BIN=../../_build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe
          rm -rf "$PKFIRE_MBT_CACHE_DIR" said.txt
          "$BIN" run say
          "$BIN" run say > replay.out 2> replay.err
          grep -q 'replaying logs' replay.out || { echo "hit did not announce a replay"; exit 1; }
          grep -q 'built the thing' replay.out || { echo "stdout was not replayed"; exit 1; }
          grep -q 'a warning' replay.err || { echo "stderr was not replayed"; exit 1; }
