name: Nix

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "pkl/**"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "pkl/**"
      - ".github/workflows/nix.yml"
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: nix build
        run: nix build .#default --print-build-logs

      - name: Smoke test
        run: |
          echo "=== wrapper check (LD_LIBRARY_PATH for openssl?) ==="
          head -c 4000 ./result/bin/pkf | strings | grep -iE "LD_LIBRARY_PATH|openssl|\.pkf-wrapped" | head || echo "(no wrapper strings — pkf is the raw binary)"
          echo "=== smoke ==="
          ./result/bin/pkf version
          ./result/bin/pkf help
