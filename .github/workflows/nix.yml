name: Nix

on:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "src/**"
      - "moon.mod"
      - "moon.work"
      - "pkl/**"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "src/**"
      - "moon.mod"
      - "moon.work"
      - "pkl/**"
      - ".github/workflows/nix.yml"
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # cachix/install-nix-action intermittently fails on the macOS runner
      # while starting the multi-user daemon:
      #
      #   ~~> Setting up the nix-daemon LaunchDaemon
      #   Could not kickstart service "org.nixos.nix-daemon": 1: Operation not permitted
      #
      # which fails the job in the installer, before anything is built. Its
      # single-user mode (`install_options: --no-daemon`) would sidestep the
      # LaunchDaemon but is documented as unsupported on macOS runners, so
      # the remedy is the installer built for CI runners instead.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          # This action defaults to installing Determinate Nix and logging
          # in to FlakeHub. This repo just needs upstream Nix to build a
          # flake, so the only intended change here is which installer runs
          # — not which Nix it installs.
          determinate: false
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: nix build
        run: nix build .#default --print-build-logs

      - name: Smoke test
        run: |
          ./result/bin/pkf version
          ./result/bin/pkf help
