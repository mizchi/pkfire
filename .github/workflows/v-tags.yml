name: v-tags

# Keep action-friendly `v<ver>` + floating `v<major>` tags in sync
# with the canonical `pkfire@<ver>` release tags. Necessary because
# GitHub Actions cannot parse `uses: <repo>@<ref>` when the ref
# contains `@`, so workflow consumers need an `@`-free pinning shape
# (see kawaz/pkf-tasks DR-0004).
#
# The job idempotently walks every `pkfire@*` tag, creates/updates
# the matching `v<ver>`, then bumps `v<major>` to the newest version
# inside each major. Safe to run any number of times.
#
# Triggers:
#   - workflow_run after a successful Release publish — picks up the
#     new tag immediately, gated on the release having actually shipped.
#   - workflow_dispatch — manual recovery if the workflow_run is missed
#     (e.g. the release was created out of band).
#   - push to main whose changes touch THIS file — self-bootstraps the
#     first time the workflow lands, so existing pre-workflow releases
#     (the 0.4.0 case) get their v-tags created with no manual step.
#
# Implementation notes:
#
# 1. Uses git CLI directly rather than `gh api git/refs` — the latter
#    returns 403 ("Resource not accessible by integration") from the
#    github-actions[bot] token even with explicit Contents:write.
#    Root cause unclear; git over HTTPS via actions/checkout's
#    credential works fine.
#
# 2. Syncs ONLY the latest pkfire@<ver> tag (not a full backfill).
#    GitHub's pre-receive hook rejects pushes that "create or update
#    workflow files" without the `workflows` permission — and
#    GITHUB_TOKEN can never have that scope. Old pkfire@<ver> commits
#    have older .github/workflows/ contents than current main, so a
#    bot push of v<old-ver> trips this hook. For the LATEST release
#    the tagged commit equals (or is reachable on) main, so workflow
#    files match and the hook passes.
#
#    Practical effect: v-tags for releases prior to this workflow
#    landing are NOT auto-backfilled. v0.4.0 and v0 were created
#    manually with a PAT before this workflow existed. From the
#    next release onward, auto-sync works.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v-tags.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # All tags so `git tag -l 'pkfire@*'` sees the full release history.
          fetch-depth: 0
      - name: Sync v<ver> + v<major> for the latest pkfire@* tag
        run: |
          set -euo pipefail
          git fetch --tags --force origin >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Pick the highest-version pkfire@* tag. `sort -V` handles
          # semver (so 0.10.0 > 0.4.0).
          latest=$(git tag -l 'pkfire@*' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "no pkfire@* tags found — nothing to sync"
            exit 0
          fi
          v="${latest#pkfire@}"
          major="${v%%.*}"
          sha=$(git rev-list -n1 "$latest")
          echo "latest release: ${latest} → ${sha:0:12}"

          # Skip pushes that are no-ops to keep the log clean.
          # `git ls-remote origin <ref>` exits 0 either way; the field
          # we care about is the printed SHA (empty when ref absent).
          remote_sha_of() {
            git ls-remote origin "refs/tags/$1" 2>/dev/null | awk '{print $1}'
          }

          refspecs=()
          for ref in "v${v}" "v${major}"; do
            current=$(remote_sha_of "$ref")
            if [ "$current" = "$sha" ]; then
              echo "  ${ref} already at ${sha:0:12} (skip)"
              continue
            fi
            git tag -f "$ref" "$sha"
            if [ -z "$current" ]; then
              echo "  ${ref} will be created at ${sha:0:12}"
            else
              echo "  ${ref} will move ${current:0:12} → ${sha:0:12}"
            fi
            # `+` force-updates: required for floating v<major>.
            refspecs+=("+refs/tags/${ref}:refs/tags/${ref}")
          done

          if [ ${#refspecs[@]} -eq 0 ]; then
            echo "nothing to push"
            exit 0
          fi
          echo "pushing ${#refspecs[@]} ref(s)"
          git push origin "${refspecs[@]}"
