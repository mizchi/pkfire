name: v-tags

# Keep action-friendly `v<ver>` + floating `v<major>` tags in sync
# with the canonical `pkfire@<ver>` release tags. Necessary because
# GitHub Actions cannot parse `uses: <repo>@<ref>` when the ref
# contains `@`, so workflow consumers need an `@`-free pinning shape
# (see kawaz/pkf-tasks DR-0004).
#
# The job idempotently walks every `pkfire@*` tag, creates/updates
# the matching `v<ver>`, then bumps `v<major>` to the newest version
# inside each major. Safe to run any number of times.
#
# Triggers:
#   - workflow_run after a successful Release publish — picks up the
#     new tag immediately, gated on the release having actually shipped.
#   - workflow_dispatch — manual recovery if the workflow_run is missed
#     (e.g. the release was created out of band).
#   - push to main whose changes touch THIS file — self-bootstraps the
#     first time the workflow lands, so existing pre-workflow releases
#     (the 0.4.0 case) get their v-tags created with no manual step.
#
# Implementation uses git CLI directly rather than `gh api git/refs`
# because the latter returns "Resource not accessible by integration"
# (HTTP 403) from the github-actions[bot] token even with explicit
# `Contents: write`. Root cause unclear (suspected GitHub App scope
# quirk); git over HTTPS using the credential set up by actions/checkout
# works fine, so we go that route.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v-tags.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # All tags so `git tag -l 'pkfire@*'` sees the full release history.
          fetch-depth: 0
      - name: Sync v<ver> + v<major> from pkfire@* tags
        run: |
          set -euo pipefail
          git fetch --tags --force origin >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          mapfile -t tags < <(git tag -l 'pkfire@*' | sort -V)
          if [ ${#tags[@]} -eq 0 ]; then
            echo "no pkfire@* tags found — nothing to sync"
            exit 0
          fi

          declare -A major_sha
          refspecs=()

          for t in "${tags[@]}"; do
            v="${t#pkfire@}"
            major="${v%%.*}"
            sha=$(git rev-list -n1 "$t")
            git tag -f "v${v}" "$sha"
            echo "  v${v} → ${sha:0:12}  (from ${t})"
            major_sha["$major"]="$sha"
            # `+` force-updates remote ref; safe because v<ver> aliases
            # the immutable pkfire@<ver> tag at the same commit, and
            # v<major> by design points at the newest version's commit.
            refspecs+=("+refs/tags/v${v}:refs/tags/v${v}")
          done

          for major in "${!major_sha[@]}"; do
            git tag -f "v${major}" "${major_sha[$major]}"
            echo "  v${major} → ${major_sha[$major]:0:12}  (floating)"
            refspecs+=("+refs/tags/v${major}:refs/tags/v${major}")
          done

          echo "pushing ${#refspecs[@]} ref(s)"
          git push origin "${refspecs[@]}"
