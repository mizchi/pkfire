name: Release

on:
  push:
    tags:
      - "pkfire@*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. pkfire@0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Pkl
        run: |
          curl -L -o /tmp/pkl-cli https://github.com/apple/pkl/releases/download/0.31.1/pkl-linux-amd64
          chmod +x /tmp/pkl-cli
          sudo mv /tmp/pkl-cli /usr/local/bin/pkl
          pkl --version

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF##refs/tags/}"
          fi
          version="${tag#pkfire@}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          declared=$(pkl eval -f json -x package.version pkl/PklProject)
          declared="${declared//\"/}"
          if [ "$declared" != "$version" ]; then
            echo "::error::tag version ($version) does not match pkl/PklProject package.version ($declared)"
            exit 1
          fi

      - name: Package
        working-directory: pkl
        run: pkl project package .

      - name: Show pkl artifacts
        run: ls -la "pkl/.out/${{ steps.tag.outputs.tag }}"

      - name: Build pkf binaries
        run: |
          version="${{ steps.tag.outputs.version }}"
          mkdir -p dist
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            goos="${target%-*}"
            goarch="${target#*-}"
            stage=$(mktemp -d)
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "$stage/pkf" ./cmd/pkf
            tar -czf "dist/pkf-${target}.tar.gz" -C "$stage" pkf
            ( cd dist && sha256sum "pkf-${target}.tar.gz" > "pkf-${target}.tar.gz.sha256" )
          done
          ls -la dist/

      - name: Resolve release notes from CHANGELOG.md
        id: notes
        run: |
          version="${{ steps.tag.outputs.version }}"
          notes_file="${{ runner.temp }}/release-notes.md"
          if scripts/release-notes.sh "$version" > "$notes_file" && [ -s "$notes_file" ]; then
            echo "::notice::release notes extracted from CHANGELOG.md for $version"
          else
            printf 'Release pkfire@%s — Pkl package + pkf binaries for linux/darwin × amd64/arm64.\n' "$version" > "$notes_file"
            echo "::warning::CHANGELOG.md has no `## [$version]` section; falling back to default body"
          fi
          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          dir="pkl/.out/$tag"
          notes="${{ steps.notes.outputs.file }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Idempotent re-run: always refresh the body so an
            # edited CHANGELOG.md propagates to the release page.
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --title "$tag" --notes-file "$notes"
          fi
          gh release upload "$tag" --clobber \
            "$dir/$tag" \
            "$dir/$tag.sha256" \
            "$dir/$tag.zip" \
            "$dir/$tag.zip.sha256" \
            dist/pkf-linux-amd64.tar.gz dist/pkf-linux-amd64.tar.gz.sha256 \
            dist/pkf-linux-arm64.tar.gz dist/pkf-linux-arm64.tar.gz.sha256 \
            dist/pkf-darwin-amd64.tar.gz dist/pkf-darwin-amd64.tar.gz.sha256 \
            dist/pkf-darwin-arm64.tar.gz dist/pkf-darwin-arm64.tar.gz.sha256
        # Action-friendly `v<ver>` + floating `v<major>` tags are
        # synced by `.github/workflows/v-tags.yml`, which fires via
        # workflow_run on this workflow's success.
