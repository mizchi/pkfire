name: Release

on:
  push:
    tags:
      - "pkfire@*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. pkfire@0.1.0)"
        required: true
      dry_run:
        description: "Build + package the matrix but skip publishing the release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # Resolve the tag/version once so every downstream job (matrix build +
  # release) shares a single source of truth. Tag push → github.ref_name;
  # workflow_dispatch → its `tag` input. The version is the bare X.Y.Z
  # (leading `pkfire@` stripped) baked into the pkf binary at build time.
  resolve:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Pkl
        run: |
          curl -L -o /tmp/pkl-cli https://github.com/apple/pkl/releases/download/0.31.1/pkl-linux-amd64
          chmod +x /tmp/pkl-cli
          sudo mv /tmp/pkl-cli /usr/local/bin/pkl
          pkl --version

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF##refs/tags/}"
          fi
          version="${tag#pkfire@}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          declared=$(pkl eval -f json -x package.version pkl/PklProject)
          declared="${declared//\"/}"
          if [ "$declared" != "$version" ]; then
            echo "::error::tag version ($version) does not match pkl/PklProject package.version ($declared)"
            exit 1
          fi

      - name: Package pkl
        working-directory: pkl
        run: pkl project package .

      - name: Show pkl artifacts
        run: ls -la "pkl/.out/${{ steps.tag.outputs.tag }}"

      - name: Upload pkl package artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkl-package
          path: pkl/.out/${{ steps.tag.outputs.tag }}/
          retention-days: 1

  # One GitHub-hosted runner per target — MoonBit native is host-only (no
  # cross-compile), so each OS/arch combination is built on a matching
  # runner. arm64 Linux + Intel/arm macOS images are all GitHub-hosted and
  # free for public repos (pkfire is public).
  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runs-on: ubuntu-latest
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
          # No darwin-amd64: the MoonBit toolchain has no x86_64 macOS
          # build (`Unsupported platform: Darwin x86_64`) and moon does
          # not honour CC for cross-arch, so Intel macOS is unsupported.
          - target: darwin-arm64
            runs-on: macos-14
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Moon version
        run: moon version --all

      # Bake the release version into pkf_version() before building. This
      # is a throwaway sed on the CI checkout only — main.mbt keeps the
      # "0.0.1" constant so local/conformance builds are unaffected.
      - name: Inject version
        run: |
          version="${{ needs.resolve.outputs.version }}"
          file="pkf-mbt/src/cmd/pkf/main.mbt"
          sed -i.bak 's/^  "0\.0\.1"$/  "'"$version"'"/' "$file"
          rm -f "$file.bak"
          grep -n "$version" "$file" || { echo "::error::version injection failed"; exit 1; }

      - name: Moon update (pkf-mbt)
        working-directory: pkf-mbt
        run: moon update

      - name: Build pkf (native, release)
        run: bash pkf-mbt/scripts/build-native.sh

      - name: Package
        run: |
          target="${{ matrix.target }}"
          mkdir -p dist
          cp pkf-mbt/_build/native/release/build/src/cmd/pkf/pkf.exe dist/pkf
          chmod +x dist/pkf
          tar -czf "pkf-${target}.tar.gz" -C dist pkf
          # shasum -a 256 is present on both macOS and ubuntu; sha256sum is
          # Linux-only. Both emit the same "<hex>  <file>" format the
          # asset contract expects.
          shasum -a 256 "pkf-${target}.tar.gz" > "pkf-${target}.tar.gz.sha256"
          echo "--- tarball contents ---"
          tar -tzf "pkf-${target}.tar.gz"
          cat "pkf-${target}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkf-${{ matrix.target }}
          path: |
            pkf-${{ matrix.target }}.tar.gz
            pkf-${{ matrix.target }}.tar.gz.sha256
          retention-days: 1

  release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download pkl package
        uses: actions/download-artifact@v4
        with:
          name: pkl-package
          path: pkldist

      - name: Download pkf binaries
        uses: actions/download-artifact@v4
        with:
          pattern: pkf-*
          merge-multiple: true
          path: dist

      - name: Show downloaded artifacts
        run: |
          ls -la pkldist/
          ls -la dist/

      - name: Resolve release notes from CHANGELOG.md
        id: notes
        run: |
          version="${{ needs.resolve.outputs.version }}"
          notes_file="${{ runner.temp }}/release-notes.md"
          if scripts/release-notes.sh "$version" > "$notes_file" && [ -s "$notes_file" ]; then
            echo "::notice::release notes extracted from CHANGELOG.md for $version"
          else
            printf 'Release pkfire@%s — Pkl package + pkf binaries for linux/darwin × amd64/arm64.\n' "$version" > "$notes_file"
            echo "::warning::CHANGELOG.md has no \`## [$version]\` section; falling back to default body"
          fi
          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        # Skip publishing on a dry-run dispatch: the matrix still builds +
        # packages + uploads artifacts above, so a maintainer can verify
        # all 4 runners produce correctly-named assets without cutting a
        # release.
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.resolve.outputs.tag }}"
          notes="${{ steps.notes.outputs.file }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Idempotent re-run: always refresh the body so an
            # edited CHANGELOG.md propagates to the release page.
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --title "$tag" --notes-file "$notes"
          fi
          gh release upload "$tag" --clobber \
            "pkldist/$tag" \
            "pkldist/$tag.sha256" \
            "pkldist/$tag.zip" \
            "pkldist/$tag.zip.sha256" \
            dist/pkf-linux-amd64.tar.gz dist/pkf-linux-amd64.tar.gz.sha256 \
            dist/pkf-linux-arm64.tar.gz dist/pkf-linux-arm64.tar.gz.sha256 \
            dist/pkf-darwin-arm64.tar.gz dist/pkf-darwin-arm64.tar.gz.sha256
        # Action-friendly `v<ver>` + floating `v<major>` tags are
        # synced by `.github/workflows/v-tags.yml`, which fires via
        # workflow_run on this workflow's success.
