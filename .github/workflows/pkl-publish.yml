name: Release

on:
  push:
    tags:
      - "pkfire@*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. pkfire@0.1.0)"
        required: true
      dry_run:
        description: "Build + package the matrix but skip publishing the release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # Resolve the tag/version once so every downstream job (matrix build +
  # release) shares a single source of truth. Tag push → github.ref_name;
  # workflow_dispatch → its `tag` input. The version is the bare X.Y.Z
  # (leading `pkfire@` stripped) baked into the pkf binary at build time.
  resolve:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Pkl
        run: |
          curl -L -o /tmp/pkl-cli https://github.com/apple/pkl/releases/download/0.32.1/pkl-linux-amd64
          chmod +x /tmp/pkl-cli
          sudo mv /tmp/pkl-cli /usr/local/bin/pkl
          pkl --version

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF##refs/tags/}"
          fi
          version="${tag#pkfire@}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          declared=$(pkl eval -f json -x package.version pkl/PklProject)
          declared="${declared//\"/}"
          if [ "$declared" != "$version" ]; then
            echo "::error::tag version ($version) does not match pkl/PklProject package.version ($declared)"
            exit 1
          fi

      - name: Package pkl
        working-directory: pkl
        run: pkl project package .

      - name: Show pkl artifacts
        run: ls -la "pkl/.out/${{ steps.tag.outputs.tag }}"

      - name: Upload pkl package artifact
        uses: actions/upload-artifact@v7
        with:
          name: pkl-package
          path: pkl/.out/${{ steps.tag.outputs.tag }}/
          retention-days: 1

  # One GitHub-hosted runner per target — MoonBit native is host-only (no
  # cross-compile), so each OS/arch combination is built on a matching
  # runner. arm64 Linux + Intel/arm macOS images are all GitHub-hosted and
  # free for public repos (pkfire is public).
  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runs-on: ubuntu-latest
          - target: linux-arm64
            runs-on: ubuntu-24.04-arm
          # No darwin-amd64: the MoonBit toolchain has no x86_64 macOS
          # build (`Unsupported platform: Darwin x86_64`) and moon does
          # not honour CC for cross-arch, so Intel macOS is unsupported.
          - target: darwin-arm64
            runs-on: macos-14
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Moon version
        run: moon version --all

      # Bake the resolved tag version into pkf_version() before building.
      # This is a throwaway sed on the CI checkout only. The source keeps
      # whatever semver bump-version.sh last set (the declared schema
      # version); CI overrides it with the tag version so the released
      # binary always matches its tag even if the source bump was missed.
      - name: Inject version
        run: |
          version="${{ needs.resolve.outputs.version }}"
          file="src/cmd/pkf/main.mbt"
          sed -i.bak -E 's/^  "[0-9]+\.[0-9]+\.[0-9]+"$/  "'"$version"'"/' "$file"
          rm -f "$file.bak"
          grep -nF "  \"$version\"" "$file" || { echo "::error::version injection failed"; exit 1; }

      - name: Moon update
        run: moon update

      - name: Build pkf (native, release)
        run: bash scripts/build-native.sh

      - name: Package
        run: |
          target="${{ matrix.target }}"
          mkdir -p dist
          cp _build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe dist/pkf
          chmod +x dist/pkf
          tar -czf "pkf-${target}.tar.gz" -C dist pkf
          # shasum -a 256 is present on both macOS and ubuntu; sha256sum is
          # Linux-only. Both emit the same "<hex>  <file>" format the
          # asset contract expects.
          shasum -a 256 "pkf-${target}.tar.gz" > "pkf-${target}.tar.gz.sha256"
          echo "--- tarball contents ---"
          tar -tzf "pkf-${target}.tar.gz"
          cat "pkf-${target}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: pkf-${{ matrix.target }}
          path: |
            pkf-${{ matrix.target }}.tar.gz
            pkf-${{ matrix.target }}.tar.gz.sha256
          retention-days: 1

  release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download pkl package
        uses: actions/download-artifact@v8
        with:
          name: pkl-package
          path: pkldist

      - name: Download pkf binaries
        uses: actions/download-artifact@v8
        with:
          pattern: pkf-*
          merge-multiple: true
          path: dist

      - name: Show downloaded artifacts
        run: |
          ls -la pkldist/
          ls -la dist/

      - name: Resolve release notes from CHANGELOG.md
        id: notes
        run: |
          version="${{ needs.resolve.outputs.version }}"
          notes_file="${{ runner.temp }}/release-notes.md"
          if scripts/release-notes.sh "$version" > "$notes_file" && [ -s "$notes_file" ]; then
            echo "::notice::release notes extracted from CHANGELOG.md for $version"
          else
            printf 'Release pkfire@%s — Pkl package + pkf binaries for linux-amd64, linux-arm64, darwin-arm64.\n' "$version" > "$notes_file"
            echo "::warning::CHANGELOG.md has no \`## [$version]\` section; falling back to default body"
          fi
          echo "file=$notes_file" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        # Skip publishing on a dry-run dispatch: the matrix still builds +
        # packages + uploads artifacts above, so a maintainer can verify
        # all 3 runners produce correctly-named assets without cutting a
        # release.
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.resolve.outputs.tag }}"
          notes="${{ steps.notes.outputs.file }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Idempotent re-run: always refresh the body so an
            # edited CHANGELOG.md propagates to the release page.
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --title "$tag" --notes-file "$notes"
          fi
          gh release upload "$tag" --clobber \
            "pkldist/$tag" \
            "pkldist/$tag.sha256" \
            "pkldist/$tag.zip" \
            "pkldist/$tag.zip.sha256" \
            dist/pkf-linux-amd64.tar.gz dist/pkf-linux-amd64.tar.gz.sha256 \
            dist/pkf-linux-arm64.tar.gz dist/pkf-linux-arm64.tar.gz.sha256 \
            dist/pkf-darwin-arm64.tar.gz dist/pkf-darwin-arm64.tar.gz.sha256 \
            install.sh
        # Action-friendly `v<ver>` + floating `v<major>` tags are retargeted
        # by the release-metadata sync step below.

      # The Nix and Homebrew packages both install release artifacts whose
      # checksums only exist after the platform build matrix finishes. Sync
      # both consumers in one follow-up commit, then point v<ver>/v<major> at
      # that commit so Nix, Homebrew and the setup Action resolve the release.
      - name: Sync release metadata + retarget v-tags
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${{ needs.resolve.outputs.version }}"
          major="${version%%.*}"
          la=$(awk '{print $1}' dist/pkf-linux-amd64.tar.gz.sha256)
          lr=$(awk '{print $1}' dist/pkf-linux-arm64.tar.gz.sha256)
          da=$(awk '{print $1}' dist/pkf-darwin-arm64.tar.gz.sha256)
          scripts/sync-release-metadata.sh "$version" "$la" "$lr" "$da"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- nix/pkf-release.json Formula/pkf.rb; then
            echo "::notice::release metadata already in sync with pkfire@${version}"
            sync_sha="$(git rev-parse HEAD)"
          else
            git add nix/pkf-release.json Formula/pkf.rb
            git commit -m "release: sync pkfire@${version} package metadata [skip ci]"
            sync_sha="$(git rev-parse HEAD)"
            # Also land it on main so the default Nix flake and Homebrew tap
            # resolve the release without an explicit ref.
            branch="release-metadata-sync-${version}"
            git push -f origin "HEAD:refs/heads/${branch}"
            gh pr create --base main --head "$branch" \
              --title "release: sync Nix and Homebrew metadata for pkfire@${version}" \
              --body "Auto-generated after the pkfire@${version} release. Updates the Nix and Homebrew checksums so both package managers resolve the new binaries. The v${version}/v${major} tags already point at this synced commit." \
              || echo "::warning::could not open the sync PR — enable 'Allow GitHub Actions to create and approve pull requests', or merge ${branch} by hand"
          fi
          # Point the @-free consumer tags at the synced commit. The canonical
          # pkfire@<ver> tag stays at the source release commit (it owns the
          # GitHub release + assets); v<ver>/v<major> are the pinnable shape.
          git tag -f "v${version}" "$sync_sha"
          git tag -f "v${major}"   "$sync_sha"
          git push -f origin "refs/tags/v${version}" "refs/tags/v${major}"
