name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install Pkl
        run: |
          curl -fsSL -o /tmp/pkl-cli https://github.com/apple/pkl/releases/download/0.31.1/pkl-linux-amd64
          chmod +x /tmp/pkl-cli
          sudo mv /tmp/pkl-cli /usr/local/bin/pkl
          pkl --version

      - name: Check pkfire@<ver> reference consistency
        run: scripts/check-version-consistency.sh

      - name: Build pkf (release)
        run: |
          moon update
          moon build --target native --release

      - name: Run dogfood ci (moon check/test + schema + build + integration + init-smoke)
        run: |
          BIN="$GITHUB_WORKSPACE/_build/native/release/build/src/cmd/pkf/pkf.exe"
          "$BIN" run -f examples/dogfood/Taskfile.pkl ci
