name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install Pkl
        run: |
          # --retry: this download 504s from time to time, and without a
          # retry a gateway hiccup fails the whole job before a single test
          # has run.
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            -o /tmp/pkl-cli https://github.com/apple/pkl/releases/download/0.32.1/pkl-linux-amd64
          chmod +x /tmp/pkl-cli
          sudo mv /tmp/pkl-cli /usr/local/bin/pkl
          pkl --version

      - name: Check pkfire@<ver> reference consistency
        run: scripts/check-version-consistency.sh

      # A workflow can be valid YAML and still be rejected by Actions,
      # in which case it runs *no jobs at all* — the failure looks like
      # CI skipping the checks rather than like a syntax error. Linted
      # here so a bad workflow fails a job that does run.
      - name: Lint workflows
        run: |
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml

      - name: Build pkf (release)
        run: |
          moon update
          moon build src/cmd/pkf --target native --release

      - name: Run dogfood ci (moon check/test + schema + build + integration + init-smoke)
        run: |
          BIN="$GITHUB_WORKSPACE/_build/native/release/build/mizchi/pkf/src/cmd/pkf/pkf.exe"
          "$BIN" run -f examples/dogfood/Taskfile.pkl ci
