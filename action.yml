name: Setup pkfire
description: Install the pkf task runner and the Pkl CLI on the runner.
branding:
  icon: zap
  color: orange

inputs:
  version:
    description: |
      pkfire release to install. Accepts the underlying release tag
      `pkfire@0.15.0`, the action-friendly form `v0.5.0`, a bare semver
      `0.4.0`, or the floating major `v0`. When empty, the action reads
      its own ref (so pinning via `mizchi/pkfire@v0.15.0` or `@v0` just
      works) and falls back to the latest published release.
    required: false
    default: ""
  pkl-version:
    description: Pkl CLI version to install. Set to `none` to skip Pkl install.
    required: false
    default: "0.32.1"
  install-dir:
    description: Directory where binaries are placed. Added to GITHUB_PATH.
    required: false
    default: ${{ runner.temp }}/pkfire-bin
  cache-pkl:
    description: |
      When `true`, cache `~/.pkl/cache` between runs via
      `actions/cache@v6`. Default `false` because the cache helps
      most for projects that hit `pkg.pkl-lang.org` repeatedly (Pkl
      package consumers) but is dead weight for one-shot setups.
    required: false
    default: "false"
  pkl-cache-key:
    description: |
      Override the cache key used when `cache-pkl: true`. Default is
      `pkl-<hashFiles('**/PklProject.deps.json', '**/Taskfile.pkl')>`
      which covers both library authors (PklProject.deps.json) and
      Taskfile-only consumers (Taskfile.pkl `amends` pin).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve version and platform
      id: resolve
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # GHA can't parse `uses: <repo>@pkfire@<ver>` (the second `@` in
        # the ref kills workflow file parsing — see kawaz/pkf-tasks's
        # DR-0004). So the action ref is `v<ver>` or `v<major>`; we
        # normalize either form into the underlying release tag
        # `pkfire@<ver>` that the release assets live under.
        # When a workflow token is available, attach it to the GitHub
        # API calls below so the request goes against the authenticated
        # 5000-req/hr ceiling instead of the unauthenticated 60-req/hr
        # one. Consumers that don't pass `permissions.contents: read`
        # fall back to anonymous mode; the call still works on a quiet
        # runner but flakes on busy shared IP pools.
        gh_auth_arg=()
        if [ -n "${GITHUB_TOKEN:-}" ]; then
          gh_auth_arg=(-H "Authorization: Bearer ${GITHUB_TOKEN}")
        fi

        normalize() {
          local raw="$1"
          case "$raw" in
            "" | main | master) echo ""; return ;;
            pkfire@*)           echo "$raw"; return ;;
            v[0-9]*.[0-9]*.[0-9]*) echo "pkfire@${raw#v}"; return ;;
            [0-9]*.[0-9]*.[0-9]*)  echo "pkfire@$raw"; return ;;
            v[0-9]*)
              # Floating major: pick the latest release whose tag
              # matches pkfire@<major>.*
              local major="${raw#v}"
              curl -fsSL "${gh_auth_arg[@]}" https://api.github.com/repos/mizchi/pkfire/releases \
                | sed -n 's/.*"tag_name": *"\(pkfire@'"$major"'\.[^"]*\)".*/\1/p' \
                | head -n1
              return ;;
            *) echo ""; return ;;
          esac
        }

        version="$(normalize "${{ inputs.version }}")"
        if [ -z "$version" ]; then
          version="$(normalize "${{ github.action_ref }}")"
        fi
        if [ -z "$version" ]; then
          version=$(curl -fsSL "${gh_auth_arg[@]}" https://api.github.com/repos/mizchi/pkfire/releases/latest \
            | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -n1)
        fi
        if [ -z "$version" ]; then
          echo "::error::could not resolve a pkfire release tag (input/ref/latest all came up empty)"
          exit 1
        fi

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   plat=linux-amd64;  pkl_plat=linux-amd64 ;;
          Linux-ARM64) plat=linux-arm64;  pkl_plat=linux-aarch64 ;;
          macOS-ARM64) plat=darwin-arm64; pkl_plat=macos-aarch64 ;;
          macOS-X64)
            echo "::error::Intel macOS (darwin-amd64) is not supported — the MoonBit toolchain has no x86_64 macOS build. Use an Apple Silicon runner."
            exit 1
            ;;
          *)
            echo "::error::unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}"
            exit 1
            ;;
        esac

        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "plat=$plat" >> "$GITHUB_OUTPUT"
        echo "pkl_plat=$pkl_plat" >> "$GITHUB_OUTPUT"
        echo "::notice::installing pkfire $version ($plat)"

    - name: Install pkf
      shell: bash
      run: |
        set -euo pipefail
        dir="${{ inputs.install-dir }}"
        mkdir -p "$dir"
        url="https://github.com/mizchi/pkfire/releases/download/${{ steps.resolve.outputs.version }}/pkf-${{ steps.resolve.outputs.plat }}.tar.gz"
        curl -fsSL "$url" | tar -xzf - -C "$dir"
        chmod +x "$dir/pkf"
        echo "$dir" >> "$GITHUB_PATH"

    - name: Install Pkl CLI
      if: inputs.pkl-version != 'none'
      shell: bash
      run: |
        set -euo pipefail
        dir="${{ inputs.install-dir }}"
        mkdir -p "$dir"
        url="https://github.com/apple/pkl/releases/download/${{ inputs.pkl-version }}/pkl-${{ steps.resolve.outputs.pkl_plat }}"
        curl -fsSL -o "$dir/pkl" "$url"
        chmod +x "$dir/pkl"

    - name: Smoke-test
      shell: bash
      env:
        PATH: ${{ inputs.install-dir }}:${{ env.PATH }}
      run: |
        pkf version
        if [ "${{ inputs.pkl-version }}" != "none" ]; then
          pkl --version
        fi

    # Opt-in. Restoring on a key miss is fine — the worst case is
    # `pkl project resolve` re-downloads from `pkg.pkl-lang.org`.
    - name: Cache ~/.pkl/cache
      if: inputs.cache-pkl == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.pkl/cache
        key: ${{ inputs.pkl-cache-key != '' && inputs.pkl-cache-key || format('pkl-{0}', hashFiles('**/PklProject.deps.json', '**/Taskfile.pkl')) }}
        restore-keys: pkl-
