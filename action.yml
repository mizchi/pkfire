name: Setup pkfire
description: Install the pkf task runner and the Pkl CLI on the runner.
branding:
  icon: zap
  color: orange

inputs:
  version:
    description: |
      pkfire release to install. Accepts the underlying release tag
      `pkfire@0.4.0`, the action-friendly form `v0.4.0`, a bare semver
      `0.4.0`, or the floating major `v0`. When empty, the action reads
      its own ref (so pinning via `mizchi/pkfire@v0.4.0` or `@v0` just
      works) and falls back to the latest published release.
    required: false
    default: ""
  pkl-version:
    description: Pkl CLI version to install. Set to `none` to skip Pkl install.
    required: false
    default: "0.31.1"
  install-dir:
    description: Directory where binaries are placed. Added to GITHUB_PATH.
    required: false
    default: ${{ runner.temp }}/pkfire-bin

runs:
  using: composite
  steps:
    - name: Resolve version and platform
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        # GHA can't parse `uses: <repo>@pkfire@<ver>` (the second `@` in
        # the ref kills workflow file parsing — see kawaz/pkf-tasks's
        # DR-0004). So the action ref is `v<ver>` or `v<major>`; we
        # normalize either form into the underlying release tag
        # `pkfire@<ver>` that the release assets live under.
        normalize() {
          local raw="$1"
          case "$raw" in
            "" | main | master) echo ""; return ;;
            pkfire@*)           echo "$raw"; return ;;
            v[0-9]*.[0-9]*.[0-9]*) echo "pkfire@${raw#v}"; return ;;
            [0-9]*.[0-9]*.[0-9]*)  echo "pkfire@$raw"; return ;;
            v[0-9]*)
              # Floating major: pick the latest release whose tag
              # matches pkfire@<major>.*
              local major="${raw#v}"
              curl -fsSL https://api.github.com/repos/mizchi/pkfire/releases \
                | sed -n 's/.*"tag_name": *"\(pkfire@'"$major"'\.[^"]*\)".*/\1/p' \
                | head -n1
              return ;;
            *) echo ""; return ;;
          esac
        }

        version="$(normalize "${{ inputs.version }}")"
        if [ -z "$version" ]; then
          version="$(normalize "${{ github.action_ref }}")"
        fi
        if [ -z "$version" ]; then
          version=$(curl -fsSL https://api.github.com/repos/mizchi/pkfire/releases/latest \
            | sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' | head -n1)
        fi
        if [ -z "$version" ]; then
          echo "::error::could not resolve a pkfire release tag (input/ref/latest all came up empty)"
          exit 1
        fi

        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   plat=linux-amd64;  pkl_plat=linux-amd64 ;;
          Linux-ARM64) plat=linux-arm64;  pkl_plat=linux-aarch64 ;;
          macOS-ARM64) plat=darwin-arm64; pkl_plat=macos-aarch64 ;;
          macOS-X64)   plat=darwin-amd64; pkl_plat=macos-amd64 ;;
          *)
            echo "::error::unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}"
            exit 1
            ;;
        esac

        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "plat=$plat" >> "$GITHUB_OUTPUT"
        echo "pkl_plat=$pkl_plat" >> "$GITHUB_OUTPUT"
        echo "::notice::installing pkfire $version ($plat)"

    - name: Install pkf
      shell: bash
      run: |
        set -euo pipefail
        dir="${{ inputs.install-dir }}"
        mkdir -p "$dir"
        url="https://github.com/mizchi/pkfire/releases/download/${{ steps.resolve.outputs.version }}/pkf-${{ steps.resolve.outputs.plat }}.tar.gz"
        curl -fsSL "$url" | tar -xzf - -C "$dir"
        chmod +x "$dir/pkf"
        echo "$dir" >> "$GITHUB_PATH"

    - name: Install Pkl CLI
      if: inputs.pkl-version != 'none'
      shell: bash
      run: |
        set -euo pipefail
        dir="${{ inputs.install-dir }}"
        mkdir -p "$dir"
        url="https://github.com/apple/pkl/releases/download/${{ inputs.pkl-version }}/pkl-${{ steps.resolve.outputs.pkl_plat }}"
        curl -fsSL -o "$dir/pkl" "$url"
        chmod +x "$dir/pkl"

    - name: Smoke-test
      shell: bash
      env:
        PATH: ${{ inputs.install-dir }}:${{ env.PATH }}
      run: |
        pkf version
        if [ "${{ inputs.pkl-version }}" != "none" ]; then
          pkl --version
        fi
